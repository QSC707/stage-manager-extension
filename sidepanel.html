<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Manager</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="sm-container">
    <!-- Pinned Tabs Module & Directory Toggle (Permanently Fixed at Top) -->
    <section class="sm-pinned-section has-no-pinned" id="pinned-stage-section">
      <div class="sm-section-header">
        <div class="sm-pinned-title-wrap" id="pinned-title-wrap" style="display: none;">
          <span class="sm-section-label sm-pinned-title">
            <svg class="sm-pin-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="17" x2="12" y2="22"></line>
              <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a1 1 0 0 0 0-2H8a1 1 0 0 0 0 2h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17z"></path>
            </svg>
            固定标签页
          </span>
          <span class="sm-pinned-badge" id="pinned-count">0</span>
        </div>
        <div class="sm-header-spacer"></div>
        <button class="sm-top-toggle-btn" id="btn-minimap-toggle" title="展开/收起缩略图大纲目录">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="3" x2="16" y2="21"></line>
            <line x1="19" y1="7" x2="18" y2="7"></line>
            <line x1="19" y1="11" x2="18" y2="11"></line>
            <line x1="19" y1="15" x2="18" y2="15"></line>
          </svg>
          <span>目录</span>
        </button>
      </div>
      <div class="sm-pinned-grid" id="pinned-grid" style="display: none;">
        <!-- Adaptive Square Thumbnails rendered dynamically -->
      </div>
    </section>

    <!-- Stage Manager Main Body: Corridor + VS Code Style Minimap -->
    <div class="sm-body-wrapper" id="body-wrapper">
      <!-- Stage Manager Strip Corridor -->
      <main class="sm-corridor" id="stage-corridor">
        <!-- Inactive Stage Corridor -->
        <div class="sm-section-label" id="inactive-section-label">调度长廊 (Stage Strip)</div>
        <div class="sm-stages-list" id="stages-list">
          <!-- Rendered dynamically with 3D thumbnails -->
        </div>
      </main>

      <!-- VS Code Style Thumbnail Minimap Rail -->
      <aside class="sm-minimap" id="sm-minimap">
        <div class="sm-minimap-header" title="缩略图总览目录 (拖拽或点击可快速漫游，右键可切换左右位置)">
          <span class="sm-minimap-label">MAP</span>
          <button class="sm-minimap-pos-btn" id="btn-minimap-pos" title="切换目录位置 (左侧 / 右侧)">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="7 16 3 12 7 8"></polyline>
              <polyline points="17 8 21 12 17 16"></polyline>
              <line x1="3" y1="12" x2="21" y2="12"></line>
            </svg>
          </button>
        </div>
        <div class="sm-minimap-scroll-container" id="minimap-scroll-container">
          <div class="sm-minimap-track" id="minimap-track">
            <!-- Micro cards rendered dynamically -->
          </div>
          <div class="sm-minimap-slider" id="minimap-slider" title="当前视口滑块 (可按住拖拽滚动)"></div>
        </div>
      </aside>
    </div>



    <!-- Minimap Hover Glance Popover (VS Code Style) -->
    <div class="sm-minimap-popover" id="minimap-popover" style="display: none;">
      <div class="sm-popover-header">
        <img class="sm-popover-favicon" id="popover-favicon" src="" alt="">
        <span class="sm-popover-title" id="popover-title"></span>
      </div>
      <div class="sm-popover-preview" id="popover-preview">
        <!-- Live preview or placeholder rendered dynamically -->
      </div>
    </div>

    <!-- Empty State -->
    <div class="sm-empty" id="empty-state" style="display: none;">
      <div class="sm-empty-icon">🪟</div>
      <div class="sm-empty-title">没有找到匹配的标签</div>
      <div class="sm-empty-desc">尝试换个关键词，或按 Enter 在新标签页打开搜索</div>
    </div>

    <!-- Diagnostic Logs Drawer (Collapsible) -->
    <div class="sm-logs-drawer" id="logs-drawer" style="display: none;">
      <div class="sm-logs-header">
        <div class="sm-logs-title">
          <span class="sm-logs-dot"></span>
          <span>运行诊断日志</span>
          <span class="sm-logs-count" id="logs-count">0</span>
        </div>
        <div class="sm-logs-tools">
          <button class="sm-logs-btn" id="btn-copy-logs" title="一键复制全部日志">复制</button>
          <button class="sm-logs-btn" id="btn-clear-logs" title="清空日志">清空</button>
          <button class="sm-logs-btn" id="btn-clean-db" title="清理过期的缩略图缓存">清理缓存</button>
          <button class="sm-logs-close" id="btn-close-logs">&times;</button>
        </div>
      </div>
      <div class="sm-logs-content" id="logs-content">
        <!-- Real-time log entries -->
      </div>
    </div>

    <!-- Custom Right-Click Context Menu -->
    <div class="sm-context-menu" id="tab-context-menu" style="display: none;">
      <div class="sm-ctx-item" id="ctx-split-screen">
        <span class="sm-ctx-icon">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="12" y1="3" x2="12" y2="21"></line>
          </svg>
        </span>
        <span class="sm-ctx-text">分屏</span>
      </div>
      <div class="sm-ctx-item" id="ctx-pin-tab">
        <span class="sm-ctx-text">固定标签</span>
      </div>
      <div class="sm-ctx-item" id="ctx-new-window">
        <span class="sm-ctx-text">在新窗口打开</span>
      </div>
      <div class="sm-ctx-separator"></div>
      <div class="sm-ctx-item" id="ctx-close-others">
        <span class="sm-ctx-text">关闭其他标签</span>
      </div>
      <div class="sm-ctx-item" id="ctx-close-below">
        <span class="sm-ctx-text">关闭下方标签</span>
      </div>
      <div class="sm-ctx-separator"></div>
      <div class="sm-ctx-item" id="ctx-mute-site">
        <span class="sm-ctx-text">将网站静音</span>
      </div>
    </div>
  </div>

  <script src="logger.js"></script>
  <script src="storage.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
